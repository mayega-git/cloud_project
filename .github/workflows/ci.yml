name: CI

on:
  pull_request:
    paths:
      - "application/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "application/**"
      - ".github/workflows/ci.yml"

# Read-only token and no secrets: safe for pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/backend/package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version
          docker --version
          docker compose version

      # Locked install, build, unit tests, Compose validation, image builds,
      # migrations (applied twice), and integration tests on a throwaway stack.
      - name: CI script
        run: bash application/ci-local.sh
